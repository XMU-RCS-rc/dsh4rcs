# 新生培训用的启动覆盖：安全层固定为 training 模式，培训工具照常开着。
#
# 用法：npm run dsh:start:training
#
# ## training 与 dev 的差别（以 packages/rcs-core/src/danger.ts 为准）
#
#   - L2 物理动作（烧录、电机使能、气路、总线 / 串口下发）两种模式都要人工确认；
#     training 的确认文案更重，多一句「第一次做请让老队员在旁边，当面指认急停按钮」。
#   - LG 代码生成（rcs_train_generate）在 training 下要过闸门。这个工具还没实现，
#     所以眼下这一条不改变任何一次调用。
#   - L0 只读、L1 本机写两种模式都放行 —— 构建与跑测试是学习循环的核心。
#   - 培训插件的「改动小测」跟着这个模式开关：只在 training 下，Agent 改了学员的代码，
#     本轮结束前就这次改动出 1–3 道开放题，回答原样存进学员工作目录的 .records。
#     所以这里不给 rcs-train 单独配 —— 配了会整段替换 profile 里的 rcs-train 配置（学员名字等）。
#
# 两种模式都不会拒绝任何调用：培训一样要烧代码、也用 F407。
#
# ## 为什么写死在这里，而不是改 profile
#
# guard 的 mode 是 profile 级配置。改 profile 是粘性的：为上课改成 training 却忘了改回来，
# 比赛时就一直带着；反过来培训机器照着 README 跑 dsh:start，拿到的是 dev。
# 所以培训与比赛各用一条启动命令，模式写死在各自的 overlay 里，不继承 profile。
# 比赛那条是 dsh4rcs-competition.cordis.yml。
#
# ## 注意：这里的 config 会整段替换 profile 里 rcs-guard 的 config
#
# dsh 的 patch 对 config 是整段替换，不是合并 —— 实测 overlay 只写 mode，profile 里的
# extraL2 就没了。所以这里把 guard 的配置写全。队里要加自定义的 L2 工具，加在本文件和
# dsh4rcs-competition.cordis.yml 两处的 extraL2 里；只加在 profile 的 cordis.patch.yml 里，
# 用这两条命令启动时不生效（scripts/dsh.mjs 发现这种情况会提醒）。
#
# guard 只认 rcs_* 工具。宿主自带的 bash / pwsh / write 不经过它 —— 这一层是提醒，不是沙箱。
- id: rcs-guard
  config:
    mode: training
    extraL2: []
