# 培训插件。路径一律留空 —— 由 rcs-core/paths.ts 的解析链决定，
# 这样别人 clone 下来不用改任何配置。
#
# workspaceRoot 留空时按解析链找：环境变量 RCS_TRAINING_HOME >
# 与 dsh4rcs 仓库同级的 ../rcs-training（默认）> 主目录兜底。
# 默认跟着仓库走而不是放主目录：Windows 上主目录必然在 C 盘，
# 而队里的工作盘是 D，三十多个新生的工作目录不该堆到系统盘。
# 它仍然不和两个 git 仓库混在一起，学员改坏了不会波及队内代码。
#
# 注意：本插件只发任务和出验收单，**不判定"学会了"**。
# 是否掌握由老队员提问后决定，工具只把机械部分自动化。
- insert:
    - id: rcs-train
      name: dsh-rcs-train
      config:
        curriculum: ''
        workspaceRoot: ''
        student: ''
