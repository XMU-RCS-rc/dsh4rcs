# 本地开发用的 patch overlay —— 验证阶梯 L3。
#
#   npm run build          # 先构建，见下方说明
#   npm run dsh:dev        # 带此 overlay 启动 dsh web
#   npm run dsh:config     # 只打印生效配置树，不进交互界面（排错首选）
#
# 为什么指向 lib/index.js 而不是 src/index.ts：
#   1. 适配层用相对路径 import `@rcs/core` 与 `@rcs/ui`，未构建时那些路径
#      在别的 profile 里解析不到；构建把它们打进了产物。
#   2. dsh 没有 TypeScript 源码加载器（`dsh-typert-loader` 是类型化工具注册，
#      不编译 .ts）。
#
# 四个坑，按踩到的频率排序：
#   1. **Windows 上 name 必须是 file:// URL，不能是裸的绝对路径。**
#      loader 直接对 name 做 import()，而 Node 的 ESM 加载器拒收盘符路径：
#        ERR_UNSUPPORTED_ESM_URL_SCHEME: ... Received protocol 'd:'
#      教程只说"必须是绝对路径"，在 Windows 上不够 —— 实测踩到并修正。
#      注意是三个斜杠：file:///D:/...
#   2. 相对路径同样加载不到。
#   3. 插件停在 PENDING 又不报错 = inject 的服务没就绪，用 dsh:config 看配置树。
#   4. `@deepseek-ai/*` 必须由宿主提供（构建时已外置）。若产物里混进了这些包，
#      插件会拿到与宿主不同的实例，服务标识与 instanceof 全乱 ——
#      build.mjs 会在出现这种情况时直接报错退出。
- insert:
    - id: rcs-control
      name: 'file:///D:/code/dsh4rcs/packages/dsh-rcs-control/lib/index.js'
      config:
        projectRoot: 'D:/code/RCS_code'
        configDir: 'D:/code/dsh4rcs/config'
    - id: rcs-kb
      name: 'file:///D:/code/dsh4rcs/packages/dsh-rcs-kb/lib/index.js'
      config:
        teamConfig: 'D:/code/dsh4rcs/config/team.json'
        cacheDir: ''
        appSecretEnv: 'FEISHU_APP_SECRET'
