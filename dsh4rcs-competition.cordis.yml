# 比赛/日常开发用的启动覆盖：关掉培训工具，其余照常。
#
# 用法：npm run dsh:start:competition
#
# ## 为什么只关 rcs-train
#
# 培训和比赛的差别**只在工具集**：培训机器多一套 rcs_train_*。
# 危险度判定不因此改变 —— 培训一样要烧代码、一样会用到 F407。
# guard 的 mode（dev / training）只影响 L2 确认文案的轻重与 LG 闸门，
# 两种模式都不会拒绝任何调用。
#
# ## 为什么默认装着、按需关掉，而不是默认不装
#
# rcs-train 不被调用时不做任何事，装着不碍事；而 30 多个新生各自装机，
# 少一条要记的命令就少一批人装错。所以默认全装，需要干净环境时再关。
#
# 老队员同一台笔记本既要备课又要打比赛，这条命令让他一次切换，
# 不用重装 profile。
- id: rcs-train
  disabled: true
